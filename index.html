    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      // Disable automatic button click tracking to prevent duplicate InitiateCheckout / SubscribedButtonClick
      fbq('set', 'autoConfig', false, '2019940606076995');
      fbq('init', '2019940606076995');
      fbq('track', 'PageView', {}, { eventID: 'pageview_init' });

    <!-- Early UTM Capture Script (Guarantees zero parameter loss on first load) -->
    <script>
      (function() {
        try {
          if (window.location.search) {
            var search = window.location.search.substring(1);
            var params = new URLSearchParams(search);
            var tracked = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid', 'gclid', 'src', 'sck', 'ttclid'];
            var current = {};
            tracked.forEach(function(k) {
              var v = params.get(k);
              if (v && v.trim()) current[k] = v.trim();
            });
            params.forEach(function(value, key) {
              if (value && value.trim() && (key.indexOf('utm_') === 0 || key.indexOf('src') === 0 || key.indexOf('sck') === 0)) {
                current[key] = value.trim();
              }
            });
            if (Object.keys(current).length > 0) {
              var prev = {};
              try {
                var raw = sessionStorage.getItem('cinevox_utm_tracking') || localStorage.getItem('cinevox_utm_tracking');
                if (raw) prev = JSON.parse(raw) || {};
              } catch(e) {}
              var merged = Object.assign({}, prev, current);
              var str = JSON.stringify(merged);
              try { sessionStorage.setItem('cinevox_utm_tracking', str); } catch(e) {}
              try { localStorage.setItem('cinevox_utm_tracking', str); } catch(e) {}
            }
          }
        } catch(e) {}
      })();
    </script>
    <!-- End Meta Pixel Code -->
